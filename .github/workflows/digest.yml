name: GitHub Changelog Digest

on:
  schedule:
    # Delivery time is NOT set here. The code pins it to 06:00 America/
    # Los_Angeles (PDT or PST as the date dictates) by handing the finished
    # digest to Brevo with a scheduled send time; see src/delivery.py.
    #
    # These crons only need to get a run going *before* 06:00 Pacific.
    # GitHub queues scheduled runs with a large, variable delay (this repo's
    # history, Jun-Oct 2026: ~1h50m typical minimum, 8h40m on Oct 12, 9h46m in
    # late Aug) and can drop runs under load, so:
    #   00:47 UTC primary  (5:47 PM PDT / 4:47 PM PST the evening before)
    #   02:17 UTC backup   (7:17 PM PDT / 6:17 PM PST)
    # Even at the 9h46m worst case both start by 12:03 UTC, ahead of 06:00 PDT
    # (13:00 UTC) and PST (14:00 UTC); tests/test_delivery.py enforces this
    # against these exact lines. The backup is a no-op once the morning is
    # claimed. Off-the-hour minutes dodge GitHub's top-of-hour congestion.
    - cron: '47 0 * * *'
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send only to this email (leave empty for all recipients)'
        type: string
        default: ''
      dry_run:
        description: 'Dry run (no email sent)'
        type: boolean
        default: false
      force:
        description: 'Force send even if no new entries'
        type: boolean
        default: false
      deliver_in_minutes:
        description: 'Test the scheduled-send path: deliver N minutes from now (pair with a test email)'
        type: string
        default: ''

concurrency:
  group: changelog-digest
  # Queue, never cancel: killing a run between "scheduled with Brevo" and
  # "state committed" would let the next run schedule a duplicate.
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned to an exact version on purpose: setup-uv stopped publishing
      # major/minor tags at v8 (supply-chain hardening), so "@v10" is a 404
      # and would fail the job. Bump this to the next exact version.
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install & Run
        id: run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          # Optional. Display name on the From header, and a Reply-To mailbox
          # for when replies should go somewhere other than the relay-verified
          # From address. Unset secrets arrive as "" and are ignored.
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
          # Brevo HTTP API key (xkeysib-..., not the SMTP key). REQUIRED for the
          # scheduled 06:00 delivery: only the API can hold an email until a
          # set time, and cron runs fail fast without it. SMTP is used only
          # for manual/immediate sends when this is unset.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # Passed through env (not interpolated into the script) and validated
          # as an int by main.py.
          DELIVER_IN_MINUTES: ${{ inputs.deliver_in_minutes }}
          # Manual test-run override (workflow_dispatch input). When set, the
          # digest goes only to this address. Leave empty for normal runs.
          DIGEST_TEST_EMAIL: ${{ inputs.test_email }}
          # Recipient list (comma-separated) — where subscribers live.
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: |
          uv venv && source .venv/bin/activate
          uv pip install -r requirements.lock
          git pull --rebase || true
          mkdir -p data
          
          ARGS="${{ github.event_name == 'workflow_dispatch' && '--all' || '' }} ${{ github.event_name == 'schedule' && '--scheduled-delivery' || '' }} ${{ inputs.force && '--force' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}"
          if [ -n "$DELIVER_IN_MINUTES" ]; then ARGS="$ARGS --deliver-in-minutes $DELIVER_IN_MINUTES"; fi
          
          echo "dry_run=${{ inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT
          cd src && uv run python main.py $ARGS

      - name: Persist state
        # Never persist on test-email runs: only the test address received the
        # email, so marking entries processed would skip them for everyone else.
        if: success() && !inputs.dry_run && inputs.test_email == ''
        run: |
          git diff --quiet data/state.json 2>/dev/null && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "state [skip ci]"

          # Push with rebase-and-retry. Another commit (e.g. a merged PR) can
          # land on the branch between this run's checkout and now; a bare push
          # would then be rejected and state.json would never persist — causing
          # the next run to re-send already-sent entries (duplicates). Rebasing
          # onto the latest and retrying closes that window. Other commits don't
          # touch state.json, so the rebase replays our commit cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest and retrying"
            git pull --rebase || true
          done
          echo "::error::Failed to persist data/state.json after 5 attempts"
          exit 1

      - if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📧 Changelog Digest
          | | |
          |---|---|
          | Status | ${{ job.status == 'success' && '✅' || '❌' }} |
          | Trigger | `${{ github.event_name }}` |
          | Test Email | `${{ inputs.test_email || 'all recipients' }}` |
          | Force | `${{ inputs.force || false }}` |
          | Dry Run | `${{ inputs.dry_run || false }}` |
          EOF
